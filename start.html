<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>oxygen get started</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Goudy+Bookletter+1911&family=Sorts+Mill+Goudy&family=Josefin+Sans:wght@600&family=Open+Sans:wght@700&display=swap" rel="stylesheet" />
<style>
:root{--paper:#e6e0cf;--ink:#201c15;--line:#16130e;--band:#d7d2c2}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;background:var(--paper);color:var(--ink);-webkit-font-smoothing:antialiased}
a{color:inherit;text-decoration:none}
.frame{position:fixed;inset:14px;border-radius:34px;background:var(--paper);display:grid;place-items:center;overflow:hidden}
.frame::after{content:"";position:absolute;inset:0;border:6px solid var(--line);border-radius:34px;pointer-events:none;z-index:30}
.wrap{position:relative;z-index:10;text-align:center;padding:40px 60px;max-width:760px}
.eb{font:400 15px/1 "Sorts Mill Goudy",serif;letter-spacing:.2em;text-transform:uppercase;color:rgba(32,28,21,.66)}
h1{font-family:"Goudy Bookletter 1911","Sorts Mill Goudy",serif;font-weight:400;text-transform:uppercase;letter-spacing:-.045em;font-size:56px;line-height:.98;margin-top:18px}
.steps{list-style:none;counter-reset:step;text-align:left;margin:44px auto 0;max-width:520px}
.steps li{counter-increment:step;position:relative;padding-left:56px;margin-bottom:26px;font-family:"Goudy Bookletter 1911",serif;font-size:23px;line-height:1.3;letter-spacing:-.02em}
.steps li::before{content:counter(step);position:absolute;left:0;top:50%;transform:translateY(-50%);width:38px;height:38px;border:3px solid var(--line);border-radius:50%;background:#ece7d8;font-family:"Sorts Mill Goudy",serif;font-size:17px;line-height:32px;text-align:center}
.steps a{text-decoration:underline;text-underline-offset:4px;text-decoration-thickness:2px}
.steps a:hover{color:#b3392b}
.btnw{display:inline-block;position:relative;margin-top:34px}
.pill{display:inline-block;position:relative;font:600 19px/1 "Josefin Sans",sans-serif;text-transform:uppercase;letter-spacing:.01em;border:3px solid var(--line);border-radius:999px;background:#ece7d8;box-shadow:0 7px 0 -1px var(--paper),0 7px 0 2px var(--line);transition:transform .25s,box-shadow .25s;padding:21px 62px 17px}
.pill:hover{transform:translateY(3px);box-shadow:0 4px 0 -1px var(--paper),0 4px 0 2px var(--line)}
.tick{position:absolute;top:-15px;width:22px;height:4px;border-radius:2px;background:var(--line)}
.tick.a{left:-30px;transform:rotate(24deg)}.tick.b{left:-16px;top:-23px;width:13px;transform:rotate(58deg)}.tick.c{right:-30px;transform:rotate(-30deg)}
.note{margin-top:30px;font:700 12px/1.7 "Open Sans",sans-serif;letter-spacing:.13em;text-transform:uppercase;color:rgba(32,28,21,.55)}
.logo{position:absolute;left:6.6%;top:44px;z-index:20;display:flex;align-items:center;gap:9px;font:400 26px/1 "Goudy Bookletter 1911",serif;letter-spacing:-.03em}
.logo svg{width:23px;height:26px}
@media (max-width:720px){.wrap{padding:30px 26px}h1{font-size:38px}.steps li{font-size:18px;padding-left:48px}.steps li::before{width:32px;height:32px;line-height:26px;font-size:14px}}
</style>
</head>
<body>
<div class="frame">
  <a class="logo" href="/" aria-label="Oxygen"><svg viewBox="0 0 26 30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><circle cx="13" cy="17" r="9"/><path d="M13 2v4M6.5 4.5l2 3M19.5 4.5l-2 3"/></svg>Oxygen</a>
  <div class="wrap">
    <div class="eb">getting started</div>
    <h1>Launch the<br />desktop app</h1>
    <ol class="steps">
      <li>download the oxygen desktop app <a href="/">from the landing page</a></li>
      <li>open the app and sign in with discord</li>
      <li>come back here and press the button</li>
    </ol>
    <span class="btnw"><i class="tick a"></i><i class="tick b"></i><i class="tick c"></i><a class="pill" href="/app">Open Oxygen</a></span>
    <div class="note">the website unlocks as soon as the desktop app is signed in</div>
  </div>
</div>
</body>
</html>
